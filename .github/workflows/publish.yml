name: Release

# 发布流程（AGENTS.md「版本与发布清单」的自动化部分）：
#   1. 本地把四处版本号同步好、CHANGELOG 的 [未发布] 改成 [x.y.z]
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#   3. 本工作流跑全量测试 → 校验 tag 与版本号一致 → npm pack → 建 GitHub Release（附 tgz）
#
# ⚠️ 本 fork **不发布到 npm**。
# 上游包名 `@having5548/dsh-backup` 属于原作者 having5548 的 npm scope，本仓库
# 无权 publish（会 403）。因此分发渠道是 GitHub Release，DSH 里用 Release 的
# tgz 安装：
#   dsh plugin add https://github.com/gaodayihao/dsh-backup/releases/latest/download/having5548-dsh-backup.tgz
# 若将来要发 npm，需先把 package.json 的 name 改成自己拥有的 scope。
#
# 也可以手动触发（Actions → Release → Run workflow）做一次演练：
# 只跑测试并打包，不建 Release。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只跑测试并打包，不建 Release'
        type: boolean
        default: true

permissions:
  contents: write # 创建 GitHub Release

jobs:
  release:
    name: 测试 → 校验 → 发 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ---- 先跑全绿再谈发布：一个坏包发出去比不发更糟 ----
      - name: 版本号一致性
        run: node scripts/verify-version.mjs
      - name: Syntax check
        run: node --check lib/index.js && node --check lib/store.js && node --check lib/crypto.js && node --check lib/zip.js && node --check lib/client.js && node --check lib/backupdir.js && node --check rescue/rescue.mjs
      - name: Unit & e2e tests (core)
        run: node --test test/local-test.mjs
      - name: Unit & e2e tests (v0.2 features)
        run: node --test test/v02-test.mjs
      - name: Unit & e2e tests (credentials)
        run: node --test test/credentials-test.mjs
      - name: HTTP route harness
        run: node --test test/route-harness.mjs

      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-version.mjs "${GITHUB_REF_NAME}"

      # tgz 直接作为 Release 资产分发；DSH 可直接从 URL 安装
      - name: 打包
        run: npm pack

      # README 承诺的固定下载地址必须长期有效：
      #   https://github.com/<owner>/<repo>/releases/latest/download/having5548-dsh-backup.tgz
      # 而 `npm pack` 产出的是 **带版本号** 的文件名，`latest/download/<名>` 又要求
      # 资产名与 URL 里的完全一致 —— 只上传版本化文件的话，上面那个地址必然 404。
      # 所以额外复制一份固定名的（两个都上传：版本化那份用于钉版本，固定名那份用于 latest）。
      - name: 准备 Release 资产（版本化 + 固定名）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test -f "having5548-dsh-backup-${VERSION}.tgz"
          cp "having5548-dsh-backup-${VERSION}.tgz" "having5548-dsh-backup.tgz"
          ls -l having5548-dsh-backup*.tgz

      # 用 gh 而不是第三方 action：--clobber 让重跑同一个 tag 也能覆盖，
      # 不需要先手工删 Release。
      - name: 创建 / 更新 GitHub Release（附 tgz 资产）
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          ASSETS=("having5548-dsh-backup-${VERSION}.tgz" "having5548-dsh-backup.tgz")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --generate-notes
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
